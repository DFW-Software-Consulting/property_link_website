# Local PostgreSQL for development.
# Start with:  docker compose up -d
# Host port 5434 is used to avoid clashing with other local Postgres instances.
services:
  postgres:
    image: postgres:16
    container_name: property_link_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_link
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_link"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
